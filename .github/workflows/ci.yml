name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t cartedumonde-app .

      - name: Lancer le conteneur
        run: docker run -d --name cartedumonde -p 5000:5000 cartedumonde-app

      - name: Attendre que l'application démarre
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000 > /dev/null; then
              echo "L'application répond."
              exit 0
            fi
            echo "En attente... ($i/15)"
            sleep 2
          done
          echo "L'application n'a pas démarré."
          docker logs cartedumonde
          exit 1

      - name: Test de fumée (curl)
        run: curl -fsS http://localhost:5000

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker logs cartedumonde

      - name: Nettoyer
        if: always()
        run: docker rm -f cartedumonde
